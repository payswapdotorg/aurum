version: 1

# Existing ZCode modules are legacy platform substrate unless explicitly migrated.
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: zcode-platform
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: zcode-platform
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false
  - id: aurum-domain
    roots: [packages/aurum-domain/src]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/aurum-domain/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: W-B
  - id: aurum-provider
    roots: [packages/aurum-provider/src]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/aurum-provider/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: W-C
  - id: aurum-agent
    roots: [packages/aurum-agent/src]
    managed: true
    requires: [shared, aurum-provider]
    publicEntrypoints: [packages/aurum-agent/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: W-C
  - id: aurum-execution
    roots: [packages/aurum-execution/src]
    managed: true
    requires: [shared]
    publicEntrypoints: [packages/aurum-execution/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: W-C
  - id: aurum-application
    roots: [packages/aurum-application/src]
    managed: true
    requires: [shared, aurum-domain, aurum-provider, aurum-agent, aurum-execution]
    publicEntrypoints: [packages/aurum-application/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: W-A
  - id: aurum-marketplace
    roots: [packages/aurum-marketplace/src]
    managed: true
    requires: [shared, aurum-domain, aurum-agent]
    publicEntrypoints: [packages/aurum-marketplace/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: W-B
  - id: aurum-connectors
    roots: [packages/aurum-connectors/src]
    managed: true
    requires: [shared, aurum-domain]
    publicEntrypoints: [packages/aurum-connectors/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: W-A
  - id: aurum-infra
    roots: [packages/aurum-infra/src]
    managed: true
    requires: [shared, aurum-domain]
    publicEntrypoints: [packages/aurum-infra/src/index.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: TL

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
